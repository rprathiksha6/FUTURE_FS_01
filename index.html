<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
   <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Primary SEO -->
    <title>Prathiksha R — Aspiring Full-Stack Web Developer</title>
    <meta
      name="description"
      content="Portfolio of Prathiksha R, an aspiring full-stack web developer. Explore projects, skills, and experience, and get in touch about opportunities."
    />
    <meta name="author" content="Prathiksha R" />
    <link rel="canonical" href="https://YOUR-DOMAIN-HERE.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Prathiksha R — Aspiring Full-Stack Web Developer" />
    <meta
      property="og:description"
      content="Portfolio of Prathiksha R, an aspiring full-stack web developer. Explore projects, skills, and experience, and get in touch about opportunities."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN-HERE.com/" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prathiksha R — Aspiring Full-Stack Web Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Prathiksha R, an aspiring full-stack web developer. Explore projects, skills, and experience, and get in touch about opportunities."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts: Space Grotesk (display), Inter (body), JetBrains Mono (code/utility) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: helps search engines understand this is a Person's portfolio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Prathiksha R",
        "jobTitle": "Aspiring Full-Stack Web Developer",
        "url": "https://YOUR-DOMAIN-HERE.com/",
        "sameAs": ["[MY GITHUB URL]", "[MY LINKEDIN URL]"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
